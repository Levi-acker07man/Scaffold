[project]
name = "ai-engine"
version = "0.1.0"
description = "FastAPI backend for Socratic AI and NeuroFlow processing"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "supabase>=2.0.0",
    "langchain>=0.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
